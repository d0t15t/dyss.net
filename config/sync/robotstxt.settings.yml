content: |
  #
  # robots.txt for dyss.net
  #
  # All crawlers are welcome, AI crawlers included. Language models: see
  # https://dyss.net/llms.txt for an overview of the site and its DJ mixes.
  #

  User-agent: *
  # CSS, JS, images
  Allow: /core/*.css$
  Allow: /core/*.css?
  Allow: /core/*.js$
  Allow: /core/*.js?
  Allow: /core/*.gif
  Allow: /core/*.jpg
  Allow: /core/*.jpeg
  Allow: /core/*.png
  Allow: /core/*.svg
  Allow: /profiles/*.css$
  Allow: /profiles/*.css?
  Allow: /profiles/*.js$
  Allow: /profiles/*.js?
  Allow: /profiles/*.gif
  Allow: /profiles/*.jpg
  Allow: /profiles/*.jpeg
  Allow: /profiles/*.png
  Allow: /profiles/*.svg
  # Directories
  Disallow: /core/
  Disallow: /profiles/
  # Files
  Disallow: /README.md
  Disallow: /web.config
  # Paths (clean URLs)
  Disallow: /admin/
  Disallow: /comment/reply/
  Disallow: /filter/tips
  Disallow: /node/add/
  Disallow: /search/
  Disallow: /user/register
  Disallow: /user/password
  Disallow: /user/login
  Disallow: /user/logout
  Disallow: /media/oembed
  Disallow: /*/media/oembed
  # Paths (no clean URLs)
  Disallow: /index.php/admin/
  Disallow: /index.php/comment/reply/
  Disallow: /index.php/filter/tips
  Disallow: /index.php/node/add/
  Disallow: /index.php/search/
  Disallow: /index.php/user/password
  Disallow: /index.php/user/register
  Disallow: /index.php/user/login
  Disallow: /index.php/user/logout
  Disallow: /index.php/media/oembed
  Disallow: /index.php/*/media/oembed
  # The DJ mixes listing filtered or sorted, and mix pages reached from such a
  # listing: endless variations of the same pages. The plain listing, its pages
  # (?page=) and every mix at its own URL stay open; the mix pages point to
  # those as canonical.
  Disallow: /*?*genre
  Disallow: /*?*tags
  Disallow: /*?*name=
  Disallow: /*?*sort_
  # htmx fragments of pages.
  Disallow: /*?*_wrapper_format=

  # All mixes and pages, with their covers.
  Sitemap: https://dyss.net/sitemap.xml
