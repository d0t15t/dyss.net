_core:
  default_config_hash: Jjjrh4RjLyktLWdYXFMsV5d0VXW3xTyho7uDOQqCKlU
id: insurance_vectors
name: 'Insurance vectors'
description: 'Semantic (vector) index of the insurance policies and documents in Milvus. Private: query it only from code or views restricted to "View insurance records".'
read_only: false
field_settings:
  document_date:
    label: 'Document date'
    datasource_id: 'entity:media'
    property_path: field_document_date
    type: date
    dependencies:
      config:
        - field.storage.media.field_document_date
  document_insured:
    label: 'Document » Insured persons'
    datasource_id: 'entity:media'
    property_path: 'field_policy:entity:field_insured_persons:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.media.field_policy
        - field.storage.node.field_insured_persons
      module:
        - node
        - taxonomy
  document_insurer:
    label: 'Document » Insurer'
    datasource_id: 'entity:media'
    property_path: 'field_policy:entity:field_insurer:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.media.field_policy
        - field.storage.node.field_insurer
      module:
        - node
        - taxonomy
  document_policy:
    label: 'Document » Policy title'
    datasource_id: 'entity:media'
    property_path: 'field_policy:entity:title'
    type: string
    dependencies:
      config:
        - field.storage.media.field_policy
      module:
        - node
  document_policy_id:
    label: 'Document » Policy ID'
    datasource_id: 'entity:media'
    property_path: field_policy
    type: integer
    dependencies:
      config:
        - field.storage.media.field_policy
  document_tax_years:
    label: 'Document tax years'
    datasource_id: 'entity:media'
    property_path: field_tax_years
    type: integer
    dependencies:
      config:
        - field.storage.media.field_tax_years
  document_title:
    label: 'Document title'
    datasource_id: 'entity:media'
    property_path: name
    type: string
    dependencies:
      module:
        - media
  document_type:
    label: 'Document type'
    datasource_id: 'entity:media'
    property_path: field_document_type
    type: string
    dependencies:
      config:
        - field.storage.media.field_document_type
  entity_bundle:
    label: 'Bundle (insurance_policy / insurance_document)'
    property_path: aggregated_field
    type: string
    configuration:
      type: union
      fields:
        - 'entity:media/bundle'
        - 'entity:node/type'
  policy_insured:
    label: 'Policy » Insured persons'
    datasource_id: 'entity:node'
    property_path: 'field_insured_persons:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.node.field_insured_persons
      module:
        - taxonomy
  policy_insurer:
    label: 'Policy » Insurer'
    datasource_id: 'entity:node'
    property_path: 'field_insurer:entity:name'
    type: string
    dependencies:
      config:
        - field.storage.node.field_insurer
      module:
        - taxonomy
  policy_status:
    label: 'Policy status'
    datasource_id: 'entity:node'
    property_path: field_policy_status
    type: string
    dependencies:
      config:
        - field.storage.node.field_policy_status
  policy_title:
    label: 'Policy title'
    datasource_id: 'entity:node'
    property_path: title
    type: string
    dependencies:
      module:
        - node
  rendered_item:
    label: 'Rendered item (Vector index view mode)'
    property_path: rendered_item
    type: text
    configuration:
      roles:
        - administrator
      view_mode:
        'entity:media':
          insurance_document: vector_index
        'entity:node':
          insurance_policy: vector_index
datasource_settings:
  'entity:media':
    bundles:
      default: false
      selected:
        - insurance_document
    languages:
      default: true
      selected: {  }
  'entity:node':
    bundles:
      default: false
      selected:
        - insurance_policy
    languages:
      default: true
      selected: {  }
