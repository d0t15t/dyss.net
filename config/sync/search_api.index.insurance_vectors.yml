  entity_type: {  }
  html_filter:
    weights:
      preprocess_index: -15
      preprocess_query: -15
    all_fields: false
    fields:
      - rendered_item
    title: false
    alt: false
    tags: {  }
  language_with_fallback: {  }
  rendered_item: {  }
  solr_date_range: {  }
