name: 'DJ mixes genre facet'
description: 'Adds a Genre facet (musical genres, with counts) to the DJ mixes listing, as an exposed filter (facets_exposed_filters) shown as checkboxes, the top 15 with a show more toggle (Better Exposed Filters), so that infinite scroll and the DJ mix pager pass the selected genres on. Indexes the Musical genres field in the content index. Requires recipes/search_view_dj_mixes and recipes/dj_mixes_mixcloud.'
type: Search
install:
  - facets_exposed_filters
  - better_exposed_filters
config:
  actions:
    search_api.index.content:
      setProperties:
        field_settings.field_musical_genres:
          label: 'Musical genres'
          datasource_id: 'entity:node'
          property_path: field_musical_genres
          type: integer
          dependencies:
            config:
              - field.storage.node.field_musical_genres
    views.view.dj_mixes:
      setProperties:
        display.default.display_options.filters.facets_field_musical_genres:
          id: facets_field_musical_genres
          table: search_api_index_content
          field: facets_field_musical_genres
          relationship: none
          group_type: group
          admin_label: ''
          plugin_id: facets_filter
          operator: or
          value: ''
          group: 1
          exposed: true
          expose:
            operator_id: ''
            label: Genre
            description: ''
            use_operator: false
            operator: ''
            operator_limit_selection: false
            operator_list: {  }
            identifier: genre
            required: false
            remember: false
            multiple: true
            remember_roles:
              authenticated: authenticated
          is_grouped: false
          hierarchy: false
          label_display: visible
          facet:
            query_operator: or
            hard_limit: 0
            min_count: 1
            missing: false
            missing_label: others
            show_numbers: true
            show_only_one_result: false
            depends_on_exposed_filter: ''
            processor_configs:
              translate_entity:
                processor_id: translate_entity
                weights:
                  build: 5
                settings: {  }
              count_widget_order:
                processor_id: count_widget_order
                weights:
                  sort: 30
                settings:
                  sort: DESC
        display.default.display_options.exposed_form.options.bef.filter.facets_field_musical_genres:
          plugin_id: bef
          advanced:
            sort_options: false
            sort_options_method: alphabetical_asc
            sort_options_natural: true
            placeholder_text: ''
            rewrite:
              filter_rewrite_values: ''
              filter_rewrite_values_key: false
            collapsible: false
            collapsible_disable_automatic_open: false
            open_by_default: false
            is_secondary: false
            hide_label: false
            field_classes: ''
          select_all_none: false
          select_all_none_nested: false
          display_inline: false
          soft_limit: 15
          soft_limit_label_less: 'Show fewer genres'
          soft_limit_label_more: 'Show more genres'
          soft_limit_include_children: false
          scrollable: false
          scrollable_height: 300
