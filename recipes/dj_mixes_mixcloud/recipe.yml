name: 'DJ Mixes: Mixcloud'
description: 'Mixcloud shows as media (dj_mixes_mixcloud): the "Mixcloud" media type (oEmbed player and cover) with fields for the Mixcloud API data - account, upload date, duration, description, cover colour, tags, picture and play/favorite/comment/repost/listener counts - and on DJ mixes a "Mixcloud" field (one item per part), a "Mixcloud URL" field and "Musical genres" (a vocabulary filled from the Mixcloud tags) (MP3 tracks on DJ mixes become optional). drush dj-mixes:mixcloud-import <account> [--filter=...] imports or refreshes an account and links Dyssembler shows to the DJ mix with the same episode number. Requires recipes/dj_mixes.'
type: 'Content type'
install:
  - dj_mixes_mixcloud
config:
  actions:
    field.field.node.dj_mix.field_tracks:
      setRequired: false
    core.entity_form_display.node.dj_mix.default:
      setComponents:
        -
          name: field_mixcloud
          options:
            type: media_library_widget
            weight: 4
            region: content
            settings:
              media_types: {  }
            third_party_settings: {  }
        -
          name: field_mixcloud_url
          options:
            type: link_default
            weight: 5
            region: content
            settings:
              placeholder_url: ''
              placeholder_title: ''
            third_party_settings: {  }
        -
          name: field_musical_genres
          options:
            type: entity_reference_autocomplete_tags
            weight: 6
            region: content
            settings:
              match_operator: CONTAINS
              match_limit: 10
              size: 60
              placeholder: ''
            third_party_settings: {  }
    core.entity_view_display.node.dj_mix.default:
      setComponents:
        -
          name: field_mixcloud
          options:
            type: entity_reference_entity_view
            label: visually_hidden
            settings:
              view_mode: default
              link: false
            third_party_settings: {  }
            weight: 5
            region: content
        -
          name: field_mixcloud_url
          options:
            type: link
            label: above
            settings:
              trim_length: 80
              url_only: false
              url_plain: false
              rel: nofollow
              target: _blank
            third_party_settings: {  }
            weight: 21
            region: content
        -
          name: field_musical_genres
          options:
            type: entity_reference_label
            label: above
            settings:
              link: true
            third_party_settings: {  }
            weight: 4
            region: content
