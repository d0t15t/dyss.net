name: 'Insurance records'
description: 'Provides a private insurance knowledge base: the "Insurance policy" content type, the "Insurance document" media type (scanned PDFs stored in the private file system, with OCR text and key figures), vocabularies for insurers, categories and insured parties, the /insurance and /insurance/documents listings, and a per-policy documents block. Everything is hidden from users without the "View insurance records" permission.'
type: 'Content type'
install:
  - insurance_records
  - block
  - datetime
  - file
  - media
  - node
  - options
  - taxonomy
  - text
  - views
config:
  strict:
    # Treat field storages strictly, since they influence the database layout.
    - field.storage.media.field_document_date
    - field.storage.media.field_document_type
    - field.storage.media.field_insurance_file
    - field.storage.media.field_ocr_text
    - field.storage.media.field_policy
    - field.storage.media.field_reported_premium
    - field.storage.media.field_reported_value
    - field.storage.media.field_scan_note
    - field.storage.media.field_scan_source
    - field.storage.media.field_tax_years
    - field.storage.media.field_value_date
    - field.storage.node.field_archive_folder
    - field.storage.node.field_benefit_start
    - field.storage.node.field_contacts
    - field.storage.node.field_insurance_category
    - field.storage.node.field_insured_persons
    - field.storage.node.field_insurer
    - field.storage.node.field_open_points
    - field.storage.node.field_policy_end
    - field.storage.node.field_policy_number
    - field.storage.node.field_policy_start
    - field.storage.node.field_policy_status
    - field.storage.node.field_policyholder
    - field.storage.node.field_premium_amount
    - field.storage.node.field_premium_interval
    - field.storage.node.field_premium_payer
    - field.storage.node.field_product_name
    - field.storage.taxonomy_term.field_party_type
    - field.storage.taxonomy_term.field_relationship
