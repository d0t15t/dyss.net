id: content
name: Content
description: 'Indexes DJ Mix and Page nodes.'
read_only: false
field_settings:
  title:
    label: Title
    type: text
    datasource_id: 'entity:node'
    property_path: title
    boost: 8
  body:
    label: 'Body (DJ Mix)'
    type: text
    datasource_id: 'entity:node'
    property_path: body
    boost: 5
  field_body:
    label: 'Body (Page)'
    type: text
    datasource_id: 'entity:node'
    property_path: field_body
    boost: 5
  field_genre:
    label: Genre
    type: string
    datasource_id: 'entity:node'
    property_path: field_genre
  field_mix_date:
    label: 'Mix date'
    type: date
    datasource_id: 'entity:node'
    property_path: field_mix_date
  field_tags:
    label: Tags
    type: integer
    datasource_id: 'entity:node'
    property_path: field_tags
  type:
    label: 'Content type'
    type: string
    datasource_id: 'entity:node'
    property_path: type
  status:
    label: 'Publishing status'
    type: boolean
    datasource_id: 'entity:node'
    property_path: status
    indexed_locked: true
    type_locked: true
  uid:
    label: 'Author ID'
    type: integer
    datasource_id: 'entity:node'
    property_path: uid
    indexed_locked: true
    type_locked: true
  created:
    label: 'Authored on'
    type: date
    datasource_id: 'entity:node'
    property_path: created
  changed:
    label: Changed
    type: date
    datasource_id: 'entity:node'
    property_path: changed
  rendered_item:
    label: 'Rendered item'
    type: text
    property_path: rendered_item
    configuration:
      roles:
        - anonymous
      view_mode:
        'entity:node':
          dj_mix: default
          page: default
processor_settings:
  entity_status:
    weights:
      preprocess_index: -10
  content_access:
    weights:
      preprocess_index: -6
      preprocess_query: -4
  add_url:
    weights:
      preprocess_index: -30
  aggregated_field:
    weights:
      add_properties: 20
  rendered_item:
    weights:
      add_properties: 0
      pre_index_save: -10
  html_filter:
    weights:
      preprocess_index: -3
      preprocess_query: -6
    fields:
      - body
      - field_body
      - rendered_item
    title: true
    alt: true
    tags:
      h1: 5
      h2: 3
      h3: 2
      string: 2
      b: 2
  ignorecase:
    weights:
      preprocess_index: -5
      preprocess_query: -8
    fields:
      - title
      - body
      - field_body
      - rendered_item
  tokenizer:
    weights:
      preprocess_index: -2
      preprocess_query: -5
    fields:
      - title
      - body
      - field_body
      - rendered_item
    spaces: ''
    overlap_cjk: 1
    minimum_word_size: '3'
  stopwords:
    weights:
      preprocess_query: -10
      postprocess_query: -10
    fields:
      - title
      - body
      - field_body
      - rendered_item
    stopwords:
      - a
      - an
      - and
      - are
      - as
      - at
      - be
      - but
      - by
      - for
      - if
      - in
      - into
      - is
      - it
      - 'no'
      - not
      - of
      - 'on'
      - or
      - s
      - such
      - t
      - that
      - the
      - their
      - then
      - there
      - these
      - they
      - this
      - to
      - was
      - will
      - with
  transliteration:
    weights:
      preprocess_index: -4
      preprocess_query: -7
    fields:
      - title
      - body
      - field_body
      - rendered_item
options:
  cron_limit: 50
  index_directly: true
datasource_settings:
  'entity:node':
    bundles:
      default: false
      selected:
        - dj_mix
        - page
languages: {  }
tracker_settings:
  default: {  }
server: solr
status: true
langcode: en
dependencies:
  config:
    - field.field.node.dj_mix.body
    - field.field.node.dj_mix.field_genre
    - field.field.node.dj_mix.field_mix_date
    - field.field.node.dj_mix.field_tags
    - field.field.node.page.field_body
    - node.type.dj_mix
    - node.type.page
    - search_api.server.solr
  module:
    - node
