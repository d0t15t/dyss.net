name: 'Insurance documents search'
description: 'A private Solr search over the insurance documents: a Search API index ("insurance_documents") with the OCR text and linked policy data, and a /insurance/search view (restricted to "View insurance records") with full-text search, highlighted excerpts and facets for document type, tax year, insurer and insured person. Requires recipes/insurance_records, recipes/search_solr and the dj_mixes module (its Views area plugin embeds the facet blocks).'
type: 'Search'
install:
  - insurance_records
  - dj_mixes
  - facets
  - search_api
  - search_api_solr
config:
  strict:
    - search_api.index.insurance_documents
