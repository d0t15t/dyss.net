id: solr
name: 'Solr (DDEV)'
description: 'Apache Solr server provided by the ddev/ddev-drupal-solr add-on (classic standalone mode, core "dev").'
backend: search_api_solr
backend_config:
  retrieve_data: false
  highlight_data: false
  site_hash: true
  server_prefix: ''
  domain: generic
  environment: ''
  connector: standard
  connector_config:
    scheme: http
    host: solr
    port: 8983
    path: /
    core: dev
    timeout: 30
    index_timeout: 60
    optimize_timeout: 10
    finalize_timeout: 30
    solr_version: ''
    http_method: AUTO
    commit_within: 1000
    jmx: false
    jts: false
    solr_install_dir: /opt/solr
    skip_schema_check: false
  optimize: false
  fallback_multiple: true
  index_single_documents_fallback_count: 0
  index_empty_text_fields: false
  index_items_with_warnings: true
  suppress_missing_languages: false
status: true
langcode: en
dependencies:
  module:
    - search_api_solr
