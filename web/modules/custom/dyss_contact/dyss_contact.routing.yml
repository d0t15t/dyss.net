dyss_contact.form:
  path: '/contact'
  defaults:
    _form: '\Drupal\dyss_contact\Form\ContactForm'
    _title_callback: '\Drupal\dyss_contact\Form\ContactForm::title'
  requirements:
    # Public contact form for any visitor; spam is limited by a honeypot and
    # flood control in ContactForm.
    _access: 'TRUE'

dyss_contact.settings:
  path: '/admin/config/system/dyss-contact'
  defaults:
    _form: '\Drupal\dyss_contact\Form\SettingsForm'
    _title: 'Contact form'
  requirements:
    _permission: 'administer site configuration'
