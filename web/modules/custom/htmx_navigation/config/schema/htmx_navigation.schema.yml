htmx_navigation.settings:
  type: config_object
  label: 'htmx navigation settings'
  mapping:
    enabled:
      type: boolean
      label: 'Enable same-site navigation'
    content_selector:
      type: string
      label: 'Content selector'
    excluded_path_patterns:
      type: sequence
      label: 'Excluded path patterns'
      sequence:
        type: string
        label: 'Path pattern'
