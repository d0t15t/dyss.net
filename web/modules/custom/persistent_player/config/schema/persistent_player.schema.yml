persistent_player.settings:
  type: config_object
  label: 'Persistent Player settings'
  mapping:
    content_selector:
      type: string
      label: 'Content selector'
    enabled_pjax_nav:
      type: boolean
      label: 'Enable same-site AJAX navigation'
    excluded_path_patterns:
      type: sequence
      label: 'Excluded path patterns'
      sequence:
        type: string
        label: 'Path pattern'
